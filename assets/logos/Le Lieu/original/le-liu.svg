<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sombra para simular el relieve metálico de las letras originales -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  
  <!-- Fondo azul oscuro / grisáceo similar al letrero -->
  <rect width="800" height="600" fill="#1b1e25"/>
  
  <g fill="#d4c084" text-anchor="middle" filter="url(#shadow)">
    <!-- Texto Superior -->
    <text x="400" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="65" letter-spacing="8">LE</text>
    
    <!-- Texto Principal -->
    <text x="400" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="180" letter-spacing="12">LIEU</text>
    
    <!-- Texto Inferior -->
    <text x="400" y="470" font-family="'Courier New', Courier, monospace" font-size="45" letter-spacing="10">fondue &amp; cocina</text>
    <text x="400" y="550" font-family="'Courier New', Courier, monospace" font-size="45" letter-spacing="10">francesa</text>
  </g>
</svg>
